# Shadowrocket: 2026-09-05 10:56:15
[General]

# Система и транспорт
bypass-system = true
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

# DNS
dns-server = https://cloudflare-dns.com/dns-query#no-h3, https://dns.google/dns-query#no-h3
fallback-dns-server = https://freedns.controld.com/p0#no-h3, https://unfiltered.adguard-dns.com/dns-query#no-h3, system
dns-direct-system = true
dns-direct-fallback-proxy = false

# IP
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true

# Служебный трафик вне прокси
# *.lan и 192.168.0.0/16 намеренно обрабатываются правилами.
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, ::1/128, fc00::/7, fe80::/10, ff00::/8, *.arpa, *.local, captive.apple.com, localhost

# Link-local и multicast вне TUN
# 192.168.0.0/16 намеренно остаётся внутри TUN.
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8

[Rule]

# Домашняя сеть
IP-CIDR,192.168.168.0/24,ДОМАШНИЙ РОУТЕР,no-resolve

# Локальные домены
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,arpa,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,local,DIRECT

# Локальные IPv4
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve

# Локальные IPv6
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,FC00::/7,DIRECT,no-resolve
IP-CIDR6,FE80::/10,DIRECT,no-resolve
IP-CIDR6,FF00::/8,DIRECT,no-resolve

# Apple
DOMAIN,captive.apple.com,DIRECT
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,DIRECT

# VPN-сервисы
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Facebook/Facebook.list,PROXY,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Google/Google.list,PROXY,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,PROXY,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Telegram/Telegram.list,PROXY,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,PROXY,force-remote-dns

# Ограниченные ресурсы
DOMAIN-SET,https://raw.githubusercontent.com/dartraiden/no-russia-hosts/master/hosts.txt,PROXY
RULE-SET,https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst,PROXY,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-ru-blocked.list,PROXY,force-remote-dns

# Остальное
FINAL,DIRECT
