[General]

update-url = https://raw.githubusercontent.com/bouvreuil34/network-configs/main/shadowrocket/mobile.conf

bypass-system = true
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

# DIRECT использует DNS сети; VPN-правила используют удалённое разрешение
dns-server = system
fallback-dns-server = https://dns.google/dns-query#no-h3
dns-direct-system = true
dns-fallback-system = false
dns-direct-fallback-proxy = false

# IPv6 намеренно отключён
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true

# *.lan и 192.168.0.0/16 обрабатываются правилами
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, ::1/128, fc00::/7, fe80::/10, ff00::/8, *.arpa, *.local, captive.apple.com, localhost

tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8

[Proxy Group]

Mobile = select,Mobile-Foreign,Mobile-Manual,select=0

# Автоматический зарубежный LTE
Mobile-Foreign = fallback,Платный VPN,use=true,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=^(?=.*LTE)(?!.*(Авто|Москва|МСК|Санкт-Петербург|СПБ|Екатеринбург|Хабаровск|Россия|РФ|LTE №61)).*$,interval=120,timeout=4

# Ручной выбор любого LTE
Mobile-Manual = select,Платный VPN,use=true,policy-regex-filter=LTE

[Rule]

DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,arpa,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,local,DIRECT

IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve

IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,FC00::/7,DIRECT,no-resolve
IP-CIDR6,FE80::/10,DIRECT,no-resolve
IP-CIDR6,FF00::/8,DIRECT,no-resolve

# Apple: служебное напрямую, остальное через VPN
DOMAIN,captive.apple.com,DIRECT
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,Mobile,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,Mobile,force-remote-dns

RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-google.list,Mobile,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-meta.list,Mobile,force-remote-dns
DOMAIN,cdn.openaimerge.com,Mobile,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-openai.list,Mobile,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-telegram.list,Mobile,force-remote-dns
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,Mobile,force-remote-dns

RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-ru-mobile-whitelist.list,DIRECT

# Ресурсы, ограниченные из России
RULE-SET,https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst,Mobile,force-remote-dns

# Ресурсы, ограничивающие доступ с российских IP
DOMAIN-SET,https://raw.githubusercontent.com/dartraiden/no-russia-hosts/master/hosts.txt,Mobile,force-remote-dns

RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-facebook.list,Mobile,no-resolve
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-telegram.list,Mobile,no-resolve

# Всё остальное напрямую
FINAL,DIRECT
