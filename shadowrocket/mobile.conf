[General]
update-url = https://raw.githubusercontent.com/bouvreuil34/network-configs/main/shadowrocket/mobile.conf

bypass-system = true
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

dns-server = system
proxy-dns-server = https://cloudflare-dns.com/dns-query#no-h3, https://dns.google/dns-query#no-h3
dns-direct-system = true
dns-fallback-system = false
dns-direct-fallback-proxy = false

ipv6 = false
prefer-ipv6 = false
private-ip-answer = true

skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, ::1/128, fc00::/7, fe80::/10, ff00::/8, *.arpa, *.local, captive.apple.com, localhost
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8

[Proxy Group]
Mobile = select,Mobile-Foreign,Mobile-Manual,select=0
Mobile-Foreign = fallback,Платный VPN,use=true,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=^(?=.*LTE)(?!.*(Авто|Москва|МСК|Санкт-Петербург|СПБ|Екатеринбург|Хабаровск|Россия|РФ|LTE №61|(?i:LTE - БЕЗЛИМИТ #1 \| TORRENT))).*$,interval=120,timeout=4
Mobile-Manual = select,Платный VPN,use=true,policy-regex-filter=LTE
Mobile-RU = fallback,Платный VPN,use=true,url=https://cp.cloudflare.com/generate_204,policy-regex-filter=^(?=.*LTE)(?=.*(Екатеринбург|Москва|МСК|Россия|РФ|Санкт-Петербург|СПБ|Хабаровск))(?!.*Авто).*$,interval=120,timeout=4

[Rule]
# Local networks
DOMAIN,localhost,DIRECT
DOMAIN-SUFFIX,arpa,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,FC00::/7,DIRECT,no-resolve
IP-CIDR6,FE80::/10,DIRECT,no-resolve
IP-CIDR6,FF00::/8,DIRECT,no-resolve

# AWS
DOMAIN-SUFFIX,amazonaws.com,Mobile

# Apple
DOMAIN,captive.apple.com,DIRECT
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,Mobile
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,Mobile

# Google
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-google.list,Mobile

# Meta
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-meta.list,Mobile

# OpenAI
DOMAIN,cdn.openaimerge.com,Mobile
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-openai.list,Mobile

# Prefect / FastMCP / Horizon
DOMAIN-SUFFIX,fastmcp.app,Mobile
DOMAIN-SUFFIX,gofastmcp.com,Mobile
DOMAIN-SUFFIX,prefect.cloud,Mobile
DOMAIN-SUFFIX,prefect.io,Mobile
DOMAIN-SUFFIX,workos.com,Mobile

# Telegram
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-telegram.list,Mobile

# YouTube
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,Mobile

# Volgaparking
DOMAIN-SUFFIX,volgaparking.ru,Mobile-RU

# Mobile whitelist
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-ru-mobile-whitelist.list,DIRECT

# Blocked in Russia
RULE-SET,https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst,Mobile

# Restricted from Russia
RULE-SET,https://raw.githubusercontent.com/bouvreuil34/network-configs/main/shadowrocket/no-russia.list,Mobile

# Meta / Telegram IP
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-facebook.list,Mobile,no-resolve
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-telegram.list,Mobile,no-resolve

FINAL,DIRECT
