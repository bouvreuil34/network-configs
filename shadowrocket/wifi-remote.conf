[General]
block-quic = all-proxy
bypass-system = true
dns-direct-fallback-proxy = false
dns-direct-system = true
dns-fallback-system = false
dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true
skip-proxy = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, ::1/128, fc00::/7, fe80::/10, ff00::/8, *.arpa, *.local, captive.apple.com, localhost
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 224.0.0.0/4, 255.255.255.255/32, ::1/128, fc00::/7, fe80::/10, ff00::/8
udp-policy-not-supported-behaviour = REJECT
update-url = https://raw.githubusercontent.com/bouvreuil34/network-configs/main/shadowrocket/wifi-remote.conf

[Rule]
# Home via VPN
IP-CIDR,192.168.168.0/24,Домашний роутер,no-resolve

# Local / special-use
DOMAIN-SUFFIX,arpa,DIRECT
DOMAIN-SUFFIX,lan,DIRECT
DOMAIN-SUFFIX,local,DIRECT
DOMAIN,localhost,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
IP-CIDR6,::1/128,DIRECT,no-resolve
IP-CIDR6,FC00::/7,DIRECT,no-resolve
IP-CIDR6,FE80::/10,DIRECT,no-resolve
IP-CIDR6,FF00::/8,DIRECT,no-resolve

# AWS / iCloud overrides
DOMAIN-SUFFIX,amazonaws.com,PROXY
DOMAIN-SUFFIX,apple-cloudkit.com,PROXY
DOMAIN-SUFFIX,apple-dns.net,PROXY
DOMAIN-SUFFIX,apple-livephotoskit.com,PROXY
DOMAIN-SUFFIX,cdn-apple.com,PROXY
DOMAIN-SUFFIX,gc.apple.com,PROXY
DOMAIN-SUFFIX,icloud-content.com,PROXY
DOMAIN-SUFFIX,icloud.com,PROXY
DOMAIN-SUFFIX,iwork.apple.com,PROXY

# Apple
DOMAIN,captive.apple.com,DIRECT
DOMAIN-SUFFIX,push.apple.com,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,DIRECT

# Google
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-google.list,PROXY

# Meta
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-meta.list,PROXY

# OpenAI
DOMAIN,cdn.openaimerge.com,PROXY
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-openai.list,PROXY

# Prefect
DOMAIN-SUFFIX,fastmcp.app,PROXY
DOMAIN-SUFFIX,gofastmcp.com,PROXY
DOMAIN-SUFFIX,prefect.cloud,PROXY
DOMAIN-SUFFIX,prefect.io,PROXY
DOMAIN-SUFFIX,workos.com,PROXY

# Telegram
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-telegram.list,PROXY

# YouTube
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/YouTube/YouTube.list,PROXY

# IP ranges
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-facebook.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-telegram.list,PROXY,no-resolve

# Restricted domains
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-ru-blocked.list,PROXY
RULE-SET,https://raw.githubusercontent.com/itdoginfo/allow-domains/main/Russia/inside-clashx.lst,PROXY
RULE-SET,https://raw.githubusercontent.com/bouvreuil34/network-configs/main/shadowrocket/no-russia.list,PROXY

FINAL,DIRECT
