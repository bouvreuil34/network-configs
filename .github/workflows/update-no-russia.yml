name: Update no-russia

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-no-russia.py
      - .github/workflows/update-no-russia.yml

permissions:
  contents: write

concurrency: update-no-russia

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Fetch and convert upstream
        run: python3 scripts/update-no-russia.py
      - name: Commit changed list
        run: |
          git add shadowrocket/no-russia.list
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update no-russia domain suffixes'
          git push origin HEAD:main
